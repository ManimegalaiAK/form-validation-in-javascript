<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }
        .container {
            width: 400px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px #aaa;
        }
        .container h2 {
            text-align: center;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }
        .btn {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #45a049;
        }
        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registration Form</h2>
    <form id="registrationForm" onsubmit="return validateForm()">
        <label for="username">Username:</label>
        <input type="text" id="username" required>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" required>
        <small>Password must be 6+ chars, include a number, uppercase, and symbol.</small>

        <label for="message">Message/Address:</label>
        <textarea id="message" required></textarea>

        <label for="contact">Contact Number:</label>
        <input type="text" id="contact" required>

        <p class="error" id="errorMsg"></p>

        <button type="submit" class="btn">Register</button>
    </form>
</div>

<script>
    function validateForm() {
        const contact = document.getElementById('contact').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        const contactPattern = /^\d{10}$/;
        const passwordPattern = /^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{6,}$/;

        if (!contactPattern.test(contact)) {
            errorMsg.textContent = "Contact number must be exactly 10 digits.";
            return false;
        }

        if (!passwordPattern.test(password)) {
            errorMsg.textContent = "Password must be at least 6 characters, include a number, an uppercase letter, and a symbol.";
            return false;
        }

        errorMsg.textContent = ""; // Clear error
        alert("Form submitted successfully!");
        return true;
    }
</script>

</body>
</html>
